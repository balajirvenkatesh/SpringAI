services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST API and web dashboard
      - "6334:6334" # gRPC, used by Spring AI
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:latest # includes vector search (FT.*), needed by the semantic cache
    ports:
      - "6379:6379"

volumes:
  qdrant_data:
