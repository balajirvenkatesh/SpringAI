spring.application.name=demo

# Groq (OpenAI-compatible API)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# SimpleLoggerAdvisor logs at DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# Create the chat memory table on startup (only if it doesn't exist)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

spring.docker.compose.stop.command=down
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=spring-ai

# Embeddings use Google Gemini (native Google GenAI module); chat stays on Groq
# Gemini's OpenAI-compatible endpoint omits "index" on the first embedding, which the OpenAI SDK rejects
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# Tavily web search (used by /api/rag/web/chat). Empty default so the app still starts without a key
tavily.api-key=${TAVILY_API_KEY:}

# Redis (Docker, compose.yaml) for the semantic cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
